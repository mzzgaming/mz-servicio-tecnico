<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MZ GAMING — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --surface: #111318; --border: #1e2230;
    --accent: #00e5ff; --danger: #ff4757; --text: #e8eaf0; --muted: #5a6080;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .login-wrap {
    position: relative; z-index: 1;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 400px;
    box-shadow: 0 0 60px rgba(0,229,255,0.05);
  }
  .logo { text-align: center; margin-bottom: 36px; }
  .logo-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 36px;
    letter-spacing: 3px; color: var(--accent); line-height: 1;
  }
  .logo-sub { font-size: 11px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .field input {
    background: #0d1017; border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px;
    padding: 13px 16px; outline: none; width: 100%;
    transition: border-color .18s, box-shadow .18s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,0.08); }
  .btn-login {
    margin-top: 24px; width: 100%; padding: 15px;
    background: var(--accent); color: #001a1f;
    border: none; border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: .4px;
    transition: opacity .18s, transform .12s;
  }
  .btn-login:hover { opacity: .9; transform: translateY(-1px); }
  .error {
    background: rgba(255,71,87,.08); border: 1px solid rgba(255,71,87,.2);
    border-radius: 8px; padding: 12px 16px; color: var(--danger);
    font-size: 13px; margin-bottom: 16px; text-align: center;
  }
  .powered { text-align: center; margin-top: 24px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-title">MZ GAMING</div>
    <div class="logo-sub">Panel de Control</div>
  </div>

  {% if error %}
  <div class="error">❌ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label>Usuario</label>
      <input type="text" name="username" placeholder="mzgaming" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">Iniciar sesión</button>
  </form>

  <div class="powered">MZ GAMING © 2026</div>
</div>
</body>
</html>
