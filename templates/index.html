<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MZ GAMING — Nueva Orden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --border: #1e2230;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --danger: #ff4757;
    --success: #00c853;
    --warn: #ffab00;
    --text: #e8eaf0;
    --muted: #5a6080;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }
  /* Grid background */
  body::before {
    content:'';
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .layout { display:flex; min-height:100vh; position:relative; z-index:1; }

  /* SIDEBAR */
  .sidebar {
    width: 240px; flex-shrink:0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex; flex-direction:column;
    padding: 28px 0;
  }
  .logo {
    padding: 0 24px 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .logo-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing:2px;
    color: var(--accent);
    line-height:1;
  }
  .logo-sub { font-size:10px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-top:2px; }
  .nav-item {
    display:flex; align-items:center; gap:12px;
    padding: 12px 24px; cursor:pointer;
    color: var(--muted); font-size:14px; font-weight:500;
    transition: all .18s; border-left:3px solid transparent;
    text-decoration:none;
  }
  .nav-item:hover { color:var(--text); background:rgba(255,255,255,0.04); }
  .nav-item.active { color:var(--accent); border-left-color:var(--accent); background:rgba(0,229,255,0.06); }
  .nav-icon { width:18px; height:18px; opacity:.7; }

  /* MAIN */
  .main { flex:1; padding:36px 40px; overflow-y:auto; }
  .page-header { margin-bottom:32px; }
  .page-header h1 { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:1.5px; color:var(--text); }
  .page-header p { color:var(--muted); font-size:14px; margin-top:4px; }

  /* FORM CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    max-width: 720px;
  }

  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .form-full { grid-column: 1/-1; }

  .field { display:flex; flex-direction:column; gap:7px; }
  .field label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }

  .field input, .field select, .field textarea {
    background: #0d1017;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size:14px; padding:11px 14px;
    transition: border-color .18s, box-shadow .18s;
    outline:none; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
  }
  .field textarea { resize:vertical; min-height:80px; }
  .field select option { background: #111318; }

  .prioridad-group { display:flex; gap:10px; }
  .prioridad-btn {
    flex:1; padding:10px; border-radius:8px;
    border:1px solid var(--border); background:transparent;
    color:var(--muted); font-family:'DM Sans',sans-serif;
    font-size:13px; font-weight:500; cursor:pointer;
    transition: all .18s; text-align:center;
  }
  .prioridad-btn:hover { border-color: #444; color:var(--text); }
  .prioridad-btn.sel-baja   { border-color:var(--success); color:var(--success); background:rgba(0,200,83,0.08); }
  .prioridad-btn.sel-normal { border-color:var(--warn);    color:var(--warn);    background:rgba(255,171,0,0.08); }
  .prioridad-btn.sel-alta   { border-color:var(--danger);  color:var(--danger);  background:rgba(255,71,87,0.08); }
  input[name="prioridad"] { display:none; }

  .divider { height:1px; background:var(--border); margin:8px 0; }

  .btn-submit {
    margin-top:24px; width:100%; padding:14px;
    background: var(--accent); color:#001a1f;
    border:none; border-radius:10px;
    font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700;
    cursor:pointer; letter-spacing:.4px;
    transition: opacity .18s, transform .12s;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-submit:hover { opacity:.9; transform:translateY(-1px); }
  .btn-submit:active { transform:translateY(0); }
  .btn-submit:disabled { opacity:.45; cursor:not-allowed; transform:none; }

  /* TOAST */
  .toast {
    position:fixed; bottom:28px; right:28px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:16px 20px;
    display:flex; align-items:center; gap:12px;
    font-size:14px; min-width:280px; z-index:999;
    transform:translateY(20px); opacity:0;
    transition:all .3s cubic-bezier(.175,.885,.32,1.275);
    pointer-events:none;
  }
  .toast.show { transform:translateY(0); opacity:1; pointer-events:auto; }
  .toast.ok   { border-left:3px solid var(--success); }
  .toast.err  { border-left:3px solid var(--danger); }
  .toast-icon { font-size:20px; }
  .toast-text strong { display:block; margin-bottom:2px; }
  .toast-text span   { color:var(--muted); font-size:12px; }

  /* SPINNER */
  .spinner { width:18px; height:18px; border:2px solid rgba(0,26,31,.3); border-top-color:#001a1f; border-radius:50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-title">MZ GAMING</div>
      <div class="logo-sub">Panel de Control</div>
    </div>
    <a href="/logout" style="display:flex;align-items:center;gap:8px;padding:8px 24px;color:var(--muted);font-size:12px;text-decoration:none;margin-bottom:4px;">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      Cerrar sesión
    </a>
    <a href="/" class="nav-item active">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Nueva orden
    </a>
    <div style="height:1px;background:var(--border);margin:8px 0"></div>
    <div style="font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 24px 4px;font-weight:600">Módulos</div>
    <a href="/orders#ordenes" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Servicio Técnico
    </a>
    <a href="/orders#resumen" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Resumen
    </a>
    <a href="/orders#ventas" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Ventas
    </a>
    <a href="/orders#stock" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      Stock
    </a>
    <a href="/orders#clientes" class="nav-item">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Clientes
    </a>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <h1>Nueva Orden de Trabajo</h1>
      <p>Completá los datos — se notifica automáticamente al grupo de técnicos</p>
    </div>

    <div class="card">
      <form id="orderForm">
        <div class="form-grid">

          <div class="field">
            <label>Nombre y apellido *</label>
            <input type="text" name="cliente" placeholder="Ej: Juan Pérez" required>
          </div>

          <div class="field">
            <label>Fecha de entrega *</label>
            <input type="date" name="fecha" required>
          </div>

          <div class="field form-full">
            <label>Componentes / equipo *</label>
            <input type="text" name="componentes" placeholder="Ej: RTX 4060, 16GB RAM, SSD 1TB — o 'Notebook HP Pavilion'" required>
          </div>

          <div class="field form-full">
            <label>Tipo de trabajo *</label>
            <select name="trabajo" required>
              <option value="">— Seleccioná —</option>
              <optgroup label="Mantenimiento">
                <option>Limpieza + pasta térmica</option>
                <option>Formateo e instalación de SO</option>
                <option>Actualización de drivers</option>
              </optgroup>
              <optgroup label="Hardware">
                <option>Cambio de RAM</option>
                <option>Instalación SSD/HDD</option>
                <option>Cambio de fuente de poder</option>
                <option>Cambio de placa de video</option>
                <option>Reparación de placa madre</option>
              </optgroup>
              <optgroup label="Software">
                <option>Eliminación de virus/malware</option>
                <option>Instalación de programas</option>
                <option>Recuperación de datos</option>
              </optgroup>
              <option value="Otro">Otro (ver notas)</option>
            </select>
          </div>

          <div class="field form-full">
            <label>Prioridad</label>
            <div class="prioridad-group">
              <button type="button" class="prioridad-btn" data-val="Baja"   onclick="setPrioridad(this)">🟢 Baja</button>
              <button type="button" class="prioridad-btn sel-normal" data-val="Normal" onclick="setPrioridad(this)">🟡 Normal</button>
              <button type="button" class="prioridad-btn" data-val="Alta"   onclick="setPrioridad(this)">🔴 Alta</button>
            </div>
            <input type="hidden" name="prioridad" value="Normal">
          </div>

          <div class="field form-full">
            <label>Notas adicionales</label>
            <textarea name="notas" placeholder="Observaciones, problemas específicos, contraseñas de usuario, etc."></textarea>
          </div>

          <div class="field">
            <label>Importe ($)</label>
            <input type="number" name="importe" placeholder="0" min="0" step="any">
          </div>

          <div class="field">
            <label>Estado de pago</label>
            <select name="estado_pago">
              <option value="Pendiente">⏳ Pendiente</option>
              <option value="Pagado">✅ Pagado</option>
              <option value="Pago Parcial">🔸 Pago Parcial</option>
            </select>
          </div>

        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          Crear orden y notificar técnicos
        </button>
      </form>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toastIcon"></span>
  <div class="toast-text">
    <strong id="toastTitle"></strong>
    <span id="toastMsg"></span>
  </div>
</div>

<script>
let selectedPrioridad = 'Normal';

function setPrioridad(btn) {
  document.querySelectorAll('.prioridad-btn').forEach(b => b.className = 'prioridad-btn');
  const val = btn.dataset.val;
  btn.classList.add('sel-' + val.toLowerCase());
  document.querySelector('input[name="prioridad"]').value = val;
  selectedPrioridad = val;
}

function showToast(ok, title, msg) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  document.getElementById('toastIcon').textContent = ok ? '✅' : '❌';
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

document.getElementById('orderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Enviando...';

  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (json.ok) {
      showToast(true, `Orden ${json.order_id} creada`, 'Los técnicos fueron notificados por Telegram');
      e.target.reset();
      setPrioridad(document.querySelector('.prioridad-btn[data-val="Normal"]'));
    } else {
      showToast(false, 'Error al crear la orden', json.error);
    }
  } catch (err) {
    showToast(false, 'Error de conexión', err.message);
  }

  btn.disabled = false;
  btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg> Crear orden y notificar técnicos`;
});

// Set fecha mínima = hoy
const dateInput = document.querySelector('input[name="fecha"]');
dateInput.min = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
